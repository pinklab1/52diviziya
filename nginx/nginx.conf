events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript;

    server {
        listen 80;
        server_name 52sd.ru www.52sd.ru admin.52sd.ru;

        # Проверка Let's Encrypt должна отвечать по HTTP и НЕ уходить в
        # редирект: certbot запрашивает файл по http://52sd.ru/.well-known/…
        # Раньше весь 80-й порт безусловно перебрасывался на HTTPS, запрос
        # приходил на просроченный сертификат, проверка падала — и продлить
        # сертификат было нельзя. Из-за этого он и истёк.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name 52sd.ru www.52sd.ru;

        ssl_certificate     /etc/letsencrypt/live/52sd.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/52sd.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Фотографии заливают через панель, дефолтный лимит nginx в 1 МБ
        # рубил их с ошибкой 413.
        client_max_body_size 50M;

        location / {
            root  /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /photos/ {
            root  /var/www;
            expires 30d;
        }

        location /api/ {
            proxy_pass http://postgrest:3000/;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";

            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }

    # ПАНЕЛЬ УПРАВЛЕНИЯ БАЗОЙ — на своём поддомене и со своим
    # сертификатом. Сам контейнер наружу не смотрит: слушает только
    # localhost, и попасть в него можно лишь через этот блок.
    server {
        listen 443 ssl;
        server_name admin.52sd.ru;

        ssl_certificate     /etc/letsencrypt/live/admin.52sd.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.52sd.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 50M;

        location / {
            proxy_pass http://adminer:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
