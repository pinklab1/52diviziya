services:

  db:
    image: postgres:16-alpine
    container_name: 52diviziya_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: 52diviziya_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI:             postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA:          public
      PGRST_DB_ANON_ROLE:       web_anon
      PGRST_OPENAPI_SERVER_PROXY_URI: https://${DOMAIN}/api
      PGRST_DB_MAX_ROWS:        1000
    ports:
      - "127.0.0.1:3000:3000"

  nocodb:
    image: nocodb/nocodb:latest
    container_name: 52diviziya_admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NC_DB: "pg://db:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}"
      NC_AUTH_JWT_SECRET: "change-this-to-random-string-12345"
    volumes:
      - nocodb_data:/usr/app/data
    ports:
      - "127.0.0.1:8080:8080"

  nginx:
    image: nginx:alpine
    container_name: 52diviziya_nginx
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/var/www/html:ro
      - /var/52diviziya/photos:/var/www/photos:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  pgdata:
    driver: local
  nocodb_data:
    driver: local