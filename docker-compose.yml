version: '3.8'

services:

  db:
    image: postgres:16-alpine
    container_name: 52diviziya_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d  # выполняется при первом запуске
    ports:
      - "127.0.0.1:5432:5432"   # только локально, не наружу
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: 52diviziya_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI:             postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA:          public
      PGRST_DB_ANON_ROLE:       web_anon       # роль для публичных запросов
      PGRST_OPENAPI_SERVER_PROXY_URI: https://${DOMAIN}/api
      PGRST_DB_MAX_ROWS:        1000           # лимит на один запрос
    ports:
      - "127.0.0.1:3000:3000"   # только локально, Nginx проксирует

  nginx:
    image: nginx:alpine
    container_name: 52diviziya_nginx
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/var/www/html:ro              # статика фронтенда
      - /var/52diviziya/photos:/var/www/photos:ro # фотографии офицеров
      - /etc/letsencrypt:/etc/letsencrypt:ro      # SSL сертификаты

volumes:
  pgdata:
    driver: local
