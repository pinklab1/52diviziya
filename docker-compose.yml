services:

  db:
    image: postgres:16-alpine
    container_name: 52diviziya_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: 52diviziya_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI:             postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA:          public
      PGRST_DB_ANON_ROLE:       web_anon
      PGRST_OPENAPI_SERVER_PROXY_URI: https://${DOMAIN}/api
      # Персон в базе больше тысячи. Со старым лимитом часть из них
      # просто не доезжала до сайта — список обрывался молча.
      PGRST_DB_MAX_ROWS:        3000
    ports:
      - "127.0.0.1:3000:3000"

  # Панель для ручной правки данных. Раньше здесь стоял nocodb — он умеет
  # больше, но тянет собственную базу, том и отдельный вход. Для «зайти,
  # поправить фамилию» хватает adminer: один контейнер без состояния.
  # Открыт только на localhost, снаружи ходит через nginx по admin.52sd.ru.
  adminer:
    image: adminer:latest
    container_name: 52diviziya_admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  nginx:
    image: nginx:alpine
    container_name: 52diviziya_nginx
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/var/www/html:ro
      - /var/52diviziya/photos:/var/www/photos:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Каталог, куда certbot кладёт файл проверки при продлении.
      - /var/www/certbot:/var/www/certbot:ro

volumes:
  pgdata:
    driver: local